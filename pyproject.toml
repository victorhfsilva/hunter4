[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hunter4"
version = "0.1.0"
description = "Scope-aware vulnerability hunter driven by AI providers (Verboo, [OI], OpenRouter, Anthropic, Ollama)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hunter4" }]
keywords = ["bug-bounty", "pentesting", "security", "ai", "verboo"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# Stdlib only. No runtime dependencies.
dependencies = []

[project.scripts]
hunter4 = "hunter4.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["hunter4"]
